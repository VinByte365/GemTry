<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 48px;
            color: #e74c3c;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #3498db;
            font-size: 16px;
            border: 1px solid #3498db;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: white;
        }

        a:hover {
            background-color: #3498db;
            color: white;
        }

        .button-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>403 - Unauthorized Access</h1>
    <p>You do not have permission to access this page.</p>
</div>

</body>
</html>
