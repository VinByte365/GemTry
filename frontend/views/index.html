<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GemTry | Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="navbar">
            <div class="logo">GemTry</div>
            <div class="nav-icons">
                <i class="fas fa-search"></i>
                <i class="fas fa-shopping-bag"></i>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sign In Section (Left) -->
        <div class="form-section signin-section">
            <div class="form-container">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Join our exclusive jewelry collection</p>
                </div>

                <form id="signin-form">
                    <div class="form-group">
                        <label for="signin-name">Full Name</label>
                        <input type="text" id="signin-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="signin-email">Email Address</label>
                        <input type="email" id="signin-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group position-relative">
                      <label for="signin-password">Password</label>
                      <div class="input-wrapper">
                        <input type="password" id="signin-password" class="form-control" placeholder="Create a password" required>
                        <i class="fa-solid fa-eye toggle-password" id="toggleSigninPassword"></i>
                      </div>
                      
                      <div class="password-strength">
                        <div class="password-strength-bar" id="signin-password-strength"></div>
                      </div>
                    </div>

                    <div class="form-group">
                        <label for="signin-phone">Phone Number</label>
                        <input type="tel" id="signin-phone" placeholder="Enter your phone number">
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>
            </div>
        </div>

        <!-- Login Section (Right) -->
        <div class="form-section login-section">
            <div class="form-container">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group position-relative">
                      <label for="login-password">Password</label>
                      <div class="input-wrapper">
                        <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                      </div>
                    </div>
                    <button type="submit" class="submit-btn">Sign In</button>
                </form>
            </div>
        </div>

        <!-- Sliding Division -->
        <div class="sliding-division" id="slidingDivision">
            <div class="division-content" id="divisionContent">
                <h2>Welcome Back!</h2>
                <p>To keep connected with us please login with your personal info</p>
                <button class="toggle-btn" id="toggleBtn">Sign In</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="copyright">
            &copy; 2023 GemTry Jewelry. All rights reserved.
        </div>
    </footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/login.js"></script>
</body>
</html>
